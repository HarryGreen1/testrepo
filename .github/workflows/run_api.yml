name: Fetch API Data Automatically

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  run-python-script:
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute Python script
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_PAT }} 
        run: python main.py

      - name: Commit and push data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add github_data.json
          # The '|| echo' part prevents the workflow from crashing if the data hasn't changed today
          git commit -m "Auto-fetch latest API data" || echo "No changes to commit"
          git push