name: Fetch and Build Team AI Reports

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build-and-export:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute API Script
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_PAT }} 
        run: python main.py

      - name: Generate Team CSV Reports
        run: python export_team_reports.py

      - name: Generate Charts, Excel Reports, and Cleanup
        run: python generate_excel_reports.py

      - name: Upload Reports as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monthly-Team-AI-Reports 
          path: Team_Reports/           
          retention-days: 7