name: Fetch and Build Team AI Reports

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  # 1. Added manual triggers for Admins
  workflow_dispatch:
    inputs:
      target_user:
        description: 'Username to modify'
        required: false
        type: string
      new_limit:
        description: 'New Budget Amount ($)'
        required: false
        type: string
      cost_center:
        description: 'Target Cost Center'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-export:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute API Script
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_PAT }} 
        run: python main.py

      - name: Generate Charts, Excel Reports, and Cleanup
        run: python generate_excel_reports.py

      - name: Generate Executive Excel Reports and Cleanup
        run: python generate_excel_reports.py

      - name: Run Nightly Budget Threshold Checks
        env:
          TARGET_USER: ${{ inputs.target_user }}
          NEW_LIMIT: ${{ inputs.new_limit }}
          COST_CENTER: ${{ inputs.cost_center }}
        run: python manage_budgets.py
        
      - name: Save State and Budget Modifications
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add mock_budgets.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update budget state" && git push)

      - name: Upload Reports as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monthly-Team-AI-Reports 
          path: Team_Reports/           
          retention-days: 7